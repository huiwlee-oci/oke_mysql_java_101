apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-demo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-demo
  template:
    metadata:
      labels:
        app: ai-demo
    spec:
      serviceAccountName: ai-demo
      automountServiceAccountToken: true
      containers:
      - name: ai-demo
        image: kix.ocir.io/sdud3frigryb/oke-registry/ai-demo:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: ai-demo-config
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      imagePullSecrets:
      - name: ocir-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ai-demo-service
spec:
  # type: LoadBalancer
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: ai-demo
